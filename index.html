<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invito di Nozze</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow-x: hidden; font-family: sans-serif; background-color: #1a0305; }

    #invito-wrapper { position: relative; width: 100%; min-height: 100vh; }

    /* Copertina con le ante */
    #busta-copertina {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100; display: flex; cursor: pointer; overflow: hidden;
    }

    .anta {
      width: 50%; height: 100%; object-fit: cover;
      transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .fiocco-centro {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 240px; max-width: 70%; z-index: 105;
      transition: opacity 0.6s ease;
    }

    .testo-tap {
      position: absolute; bottom: 35px; left: 50%;
      transform: translateX(-50%); font-size: 11px;
      letter-spacing: 3px; color: #ffffff; z-index: 101;
      font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    /* Effetto apertura */
    #busta-copertina.aperto .anta-sinistra { transform: translateX(-100%); }
    #busta-copertina.aperto .anta-destra { transform: translateX(100%); }
    #busta-copertina.aperto .fiocco-centro,
    #busta-copertina.aperto .testo-tap { opacity: 0; pointer-events: none; }
    #busta-copertina.aperto { pointer-events: none; }

    /* Parte interna dell'invito */
    #sito-interno {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .img-interno {
      width: 100%;
      max-width: 600px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div id="invito-wrapper">
    <!-- Copertina Interattiva -->
    <div id="busta-copertina" onclick="apriInvito()">
      <img class="anta anta-sinistra" src="anta-sinistra.png" alt="Anta Sinistra">
      <img class="fiocco-centro" src="fiocco.png" alt="Fiocco">
      <img class="anta anta-destra" src="anta-destra.png" alt="Anta Destra">
      <div class="testo-tap">TAP TO OPEN</div>
    </div>

    <!-- Pagine dell'Invito -->
    <div id="sito-interno">
      <img class="img-interno" src="invito-interno.png" alt="Pagina 1">
      <img class="img-interno" src="invito-pagina2.png" alt="Pagina 2">
      <img class="img-interno" src="invito-pagina3.png" alt="Pagina 3">
    </div>
  </div>

  <script>
    function apriInvito() {
      document.getElementById('busta-copertina').classList.add('aperto');
    }
  </script>

</body>
</html>
