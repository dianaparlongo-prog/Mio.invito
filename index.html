<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMAYA'S 27th BDAY BASH</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { 
      width: 100%; height: 100%; overflow-x: hidden; 
      font-family: 'Courier New', Courier, monospace; 
      background-color: #0d0118; color: #ff007f; 
    }

    #invito-wrapper { position: relative; width: 100%; min-height: 100vh; }

    /* Copertina CD Y2K */
    #copertina-cd {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100; display: flex; flex-direction: column;
      justify-content: center; align-items: center; cursor: pointer;
      background-color: #0d0118; transition: opacity 0.8s ease, visibility 0.8s;
    }

    .cd-container {
      position: relative; width: 320px; height: 320px;
      display: flex; justify-content: center; align-items: center;
    }

    .img-cd {
      width: 100%; height: 100%; object-fit: contain;
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
      transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .cd-spin { animation: spin 1.2s infinite linear; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .btn-play-cd {
      margin-top: 30px; padding: 12px 25px;
      background: #ff007f; color: #ffffff; font-weight: bold;
      font-family: sans-serif; font-size: 13px; letter-spacing: 3px;
      border: 2px solid #00ffff; border-radius: 30px;
      box-shadow: 0 0 15px #ff007f; animation: blink 1s infinite;
    }

    @keyframes blink { 50% { opacity: 0.4; } }

    #copertina-cd.nascosto { opacity: 0; visibility: hidden; pointer-events: none; }

    /* Pagine Interne */
    #sito-interno { width: 100%; display: flex; flex-direction: column; align-items: center; }

    .sezione-pagina {
      width: 100%; min-height: 100vh; padding: 40px 20px; text-align: center;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      border-bottom: 2px dashed #ff007f; position: relative;
    }

    .img-collage {
      width: 100%; max-width: 450px; height: auto; display: block;
      border: 2px solid #00ffff; box-shadow: 0 0 20px #ff007f; border-radius: 10px;
    }

    .btn-next-track {
      display: inline-block; margin-top: 25px; padding: 12px 25px;
      background: #000000; color: #00ffff; font-weight: bold;
      font-family: sans-serif; font-size: 12px; letter-spacing: 2px;
      border: 2px solid #ff007f; border-radius: 8px; text-decoration: none;
      box-shadow: 0 0 10px #00ffff; transition: transform 0.2s;
    }
    .btn-next-track:active { transform: scale(0.95); }

    /* Pagina 2: Dettagli & Countdown */
    .info-box {
      background: rgba(0,0,0,0.8); border: 2px solid #ff007f; border-radius: 10px;
      padding: 15px; width: 100%; max-width: 450px; margin-bottom: 15px;
      box-shadow: 0 0 10px #ff007f;
    }

    .countdown-box { display: flex; justify-content: center; gap: 8px; margin: 15px 0; width: 100%; max-width: 420px; }
    .time-unit {
      background: #000; padding: 10px; border-radius: 5px; flex: 1;
      border: 2px solid #00ffff; box-shadow: 0 0 8px #00ffff;
    }
    .time-unit span { display: block; font-size: 22px; font-weight: bold; color: #ff007f; font-family: sans-serif; }
    .time-unit label { font-size: 8px; text-transform: uppercase; color: #fff; opacity: 0.9; }

    .mappa-container {
      width: 100%; max-width: 450px; height: 200px; margin-top: 10px; border-radius: 8px; overflow: hidden;
      border: 2px solid #00ffff; box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
    }
    iframe { width: 100%; height: 100%; border: 0; filter: invert(90%) hue-rotate(180deg); }

    .btn-rsvp {
      display: inline-block; margin-top: 20px; padding: 15px 30px;
      background: #ff007f; color: #ffffff; text-decoration: none;
      font-weight: bold; font-family: sans-serif; border-radius: 50px; letter-spacing: 2px;
      border: 2px solid #00ffff; box-shadow: 0 0 15px #ff007f; transition: transform 0.2s;
    }
    .btn-rsvp:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div id="invito-wrapper">
    <!-- Copertina CD Animato -->
    <div id="copertina-cd" onclick="playCD()">
      <div class="cd-container">
        <img id="disco-img" class="img-cd" src="cd-copertina.png" alt="CD Y2K Amaya">
      </div>
      <div class="btn-play-cd">▶️ PLAY ALBUM</div>
    </div>

    <!-- Contenuto Interno -->
    <div id="sito-interno">
      
      <!-- PAGINA 1: Collage Fotocamera Canon -->
      <div class="sezione-pagina" id="pagina-collage">
        <img class="img-collage" src="invito-interno.png" alt="Amaya 27th Birthday Collage">
        <a href="#pagina-dettagli" class="btn-next-track">NEXT TRACK &gt;&gt;</a>
      </div>

      <!-- PAGINA 2: Countdown, Info & Mappa -->
      <div class="sezione-pagina" id="pagina-dettagli">
        <h2 style="color: #00ffff; font-size: 20px; text-transform: uppercase; text-shadow: 0 0 8px #00ffff; margin-bottom: 10px;">★ AMAYA'S 27th BDAY ★</h2>
        
        <div class="info-box">
          <p style="color: #fff; font-size: 13px;"><strong>DRESS CODE:</strong> Black Tie Classy, Upscale, Sexy / Rich Widow Vibes 💋</p>
          <p style="color: #00ffff; font-size: 12px; margin-top: 8px;"><strong>DINNER:</strong> 7:30 PM @ MaKiin</p>
          <p style="color: #00ffff; font-size: 12px;"><strong>DRINKS:</strong> 9:00 / 10:00 PM @ Lizzards Pub</p>
        </div>

        <div class="countdown-box">
          <div class="time-unit"><span id="giorni">00</span><label>Days</label></div>
          <div class="time-unit"><span id="ore">00</span><label>Hours</label></div>
          <div class="time-unit"><span id="minuti">00</span><label>Mins</label></div>
          <div class="time-unit"><span id="secondi">00</span><label>Secs</label></div>
        </div>

        <h3 style="margin-top: 10px; font-size: 16px; color: #ff007f;">LOCATION & MAP</h3>
        <p style="font-size: 12px; color: #fff;">2651 Kipling St, Houston, TX 77098</p>
        
        <div class="mappa-container">
          <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3464.2!2d-95.421!3d29.738!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjl8NDQnMTYuOCJOIDk1wrAyNScxNS42Ilc!5e0!3m2!1sit!2sit!4v1700000000000!5m2!1sit!2sit" allowfullscreen="" loading="lazy"></iframe>
        </div>

        <a href="https://wa.me/1234567890?text=Ciao%20Amaya!%20Confermo%20la%20mia%20presenza%20per%20il%20tuo%2027°%20compleanno!" class="btn-rsvp" target="_blank">
          CONFIRM ACCESS (RSVP) 📲
        </a>
      </div>

    </div>
  </div>

  <script>
    function playCD() {
      const disco = document.getElementById('disco-img');
      const copertina = document.getElementById('copertina-cd');
      
      disco.classList.add('cd-spin');

      setTimeout(function() {
        copertina.classList.add('nascosto');
      }, 1000);
    }

    // Data aggiornata: 6 Febbraio 2027 (dall'immagine del CD)
    const dataFesta = new Date(2027, 1, 6, 19, 30, 0).getTime();

    const timer = setInterval(function() {
      const ora = new Date().getTime();
      const differenza = dataFesta - ora;

      if (differenza > 0) {
        document.getElementById("giorni").innerText = Math.floor(differenza / (1000 * 60 * 60 * 24));
        document.getElementById("ore").innerText = Math.floor((differenza % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        document.getElementById("minuti").innerText = Math.floor((differenza % (1000 * 60 * 60)) / (1000 * 60));
        document.getElementById("secondi").innerText = Math.floor((differenza % (1000 * 60)) / 1000);
      } else {
        clearInterval(timer);
      }
    }, 1000);
  </script>

</body>
</html>
