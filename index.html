<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invito di Nozze</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow-x: hidden; font-family: 'Georgia', serif; background-color: #1a0305; color: #ffffff; }

    #invito-wrapper { position: relative; width: 100%; min-height: 100vh; }

    /* Copertina */
    #busta-copertina {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100; display: flex; cursor: pointer; overflow: hidden;
      background-color: #1a0305;
    }

    .anta {
      width: 50%; height: 100%; object-fit: cover;
      transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
      z-index: 102;
    }

    .fiocco-centro {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 240px; max-width: 70%; z-index: 105;
      transition: opacity 0.6s ease;
    }

    .testo-tap {
      position: absolute; bottom: 35px; left: 50%;
      transform: translateX(-50%); font-size: 11px;
      letter-spacing: 3px; color: #ffffff; z-index: 106;
      font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      font-family: sans-serif;
    }

    #busta-copertina.aperto .anta-sinistra { transform: translateX(-100%); }
    #busta-copertina.aperto .anta-destra { transform: translateX(100%); }
    #busta-copertina.aperto .fiocco-centro,
    #busta-copertina.aperto .testo-tap { opacity: 0; pointer-events: none; }
    #busta-copertina.aperto { pointer-events: none; background-color: transparent; transition: background-color 1s linear; }

    /* Pagine Interne Centrate */
    #sito-interno {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #1a0305;
    }

    .sezione-pagina {
      width: 100%;
      max-width: 500px;
      padding: 30px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center; /* Centra verticalmente */
      align-items: center;     /* Centra orizzontalmente */
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .img-interno { width: 100%; height: auto; display: block; }
    
    /* Pagina 1: Sovrapposizione Testo al centro esatto dell'immagine */
    .p-relative { position: relative; width: 100%; }
    
    .overlay-testo-p1 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      text-align: center;
      color: #1a0305;
    }

    .titolo-sposi { font-size: 28px; letter-spacing: 2px; font-weight: bold; }
    .data-evento { font-size: 15px; margin-top: 6px; font-style: italic; }

    /* Pagina 2: Countdown e Mappa */
    .countdown-box {
      display: flex; justify-content: center; gap: 10px; margin: 15px 0; width: 100%;
    }
    .time-unit {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px; border-radius: 8px; min-width: 60px;
      border: 1px solid rgba(243, 229, 171, 0.3);
    }
    .time-unit span { display: block; font-size: 20px; font-weight: bold; color: #f3e5ab; }
    .time-unit label { font-size: 9px; text-transform: uppercase; font-family: sans-serif; opacity: 0.8; }

    .mappa-container {
      width: 100%; height: 200px; margin-top: 10px; border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }
    iframe { width: 100%; height: 100%; border: 0; }

    /* Pagina 3: Dress Code e RSVP */
    .btn-rsvp {
      display: inline-block; margin-top: 20px; padding: 12px 28px;
      background-color: #f3e5ab; color: #1a0305; text-decoration: none;
      font-weight: bold; font-family: sans-serif; border-radius: 30px;
      letter-spacing: 1px; transition: transform 0.2s ease;
    }
    .btn-rsvp:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div id="invito-wrapper">
    <!-- Copertina -->
    <div id="busta-copertina" onclick="apriInvito()">
      <img class="anta anta-sinistra" src="anta-sinistra.png" alt="Anta Sinistra">
      <img class="fiocco-centro" src="fiocco.png" alt="Fiocco">
      <img class="anta anta-destra" src="anta-destra.png" alt="Anta Destra">
      <div class="testo-tap">TAP TO OPEN</div>
    </div>

    <!-- Contenuto Interno Centrato -->
    <div id="sito-interno">
      
      <!-- PAGINA 1 -->
      <div class="sezione-pagina">
        <div class="p-relative">
          <img class="img-interno" src="invito-interno.png" alt="Invito">
          <div class="overlay-testo-p1">
            <h1 class="titolo-sposi">Marco & Sofia</h1>
            <p class="data-evento">15 Settembre 2027</p>
          </div>
        </div>
      </div>

      <!-- PAGINA 2 -->
      <div class="sezione-pagina">
        <h2 style="color: #f3e5ab; font-size: 22px;">Il Countdown</h2>
        <div class="countdown-box">
          <div class="time-unit"><span id="giorni">00</span><label>Giorni</label></div>
          <div class="time-unit"><span id="ore">00</span><label>Ore</label></div>
          <div class="time-unit"><span id="minuti">00</span><label>Min</label></div>
          <div class="time-unit"><span id="secondi">00</span><label>Sec</label></div>
        </div>

        <h3 style="margin-top: 15px; font-size: 18px; color: #f3e5ab;">Villa Balbiano</h3>
        <p style="font-size: 13px; opacity: 0.8; margin-top: 4px;">Piazza Sommariva 2, Ossuccio, Lago di Como</p>
        
        <div class="mappa-container">
          <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2777.491328902517!2d9.1724213!3d45.9614532!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x478423f044943f65%3A0xb351e2333792fa6!2sVilla%20Balbiano!5e0!3m2!1sit!2sit!4v1700000000000!5m2!1sit!2sit" allowfullscreen="" loading="lazy"></iframe>
        </div>
      </div>

      <!-- PAGINA 3 -->
      <div class="sezione-pagina">
        <h2 style="color: #f3e5ab; font-size: 22px;">Dress Code</h2>
        <p style="margin-top: 8px; font-size: 15px; font-style: italic;">Elegante & Formale</p>
        
        <hr style="margin: 20px auto; width: 40%; border: 0; border-top: 1px solid rgba(255,255,255,0.2);">

        <h2 style="color: #f3e5ab; font-size: 22px;">Conferma la tua presenza</h2>
        <p style="font-size: 13px; margin-top: 8px; opacity: 0.8;">È gradita gentile conferma entro il 15 Luglio 2027</p>
        
        <a href="https://wa.me/393331234567?text=Ciao!%20Confermo%20la%20mia%20presenza%20al%20matrimonio!" class="btn-rsvp" target="_blank">
          CONFERMA SU WHATSAPP
        </a>
      </div>

    </div>
  </div>

  <script>
    function apriInvito() {
      document.getElementById('busta-copertina').classList.add('aperto');
    }

    const dataMatrimonio = new Date(2027, 8, 15, 16, 30, 0).getTime();

    const timer = setInterval(function() {
      const ora = new Date().getTime();
      const differenza = dataMatrimonio - ora;

      if (differenza > 0) {
        document.getElementById("giorni").innerText = Math.floor(differenza / (1000 * 60 * 60 * 24));
        document.getElementById("ore").innerText = Math.floor((differenza % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        document.getElementById("minuti").innerText = Math.floor((differenza % (1000 * 60 * 60)) / (1000 * 60));
        document.getElementById("secondi").innerText = Math.floor((differenza % (1000 * 60)) / 1000);
      } else {
        clearInterval(timer);
      }
    }, 1000);
  </script>

</body>
</html>
